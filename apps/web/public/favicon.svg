<svg
  height="24"
  viewBox="0 0 24 24"
  width="24"
  xmlns="http://www.w3.org/2000/svg"
>
  <title>Noddle</title>
  <style>
  .mark {
    fill: oklch(0.205 0 0);
  }
  @media (prefers-color-scheme: dark) {
    .mark {
      fill: oklch(0.922 0 0);
    }
  }
  </style>
  <mask height="24" id="slot" maskUnits="userSpaceOnUse" width="24" x="0" y="0">
    <rect fill="white" height="24" rx="6.2" width="24" x="0" y="0" />
    <rect fill="black" height="4.2" rx="2.1" width="10.4" x="6.8" y="15.7" />
  </mask>
  <rect
    class="mark"
    height="24"
