name: noddle

services:
  traefik:
    image: traefik:v3.7.9
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.swarm=true
      - --providers.swarm.exposedByDefault=false
      - --providers.swarm.network=noddle-public
      - --entrypoints.web.address=:80
      - --log.level=INFO
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - noddle-public

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: noddle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing}
      POSTGRES_DB: noddle
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noddle -d noddle"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - noddle-public

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - noddle-public

  registry:
    image: registry:3.1.1
    restart: unless-stopped
    environment:
      REGISTRY_HTTP_ADDR: 0.0.0.0:5000
      REGISTRY_HTTP_TLS_CERTIFICATE: /certs/registry.crt
      REGISTRY_HTTP_TLS_KEY: /certs/registry.key
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: noddle
      REGISTRY_AUTH_HTPASSWD_PATH: /certs/htpasswd
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    ports:
      - "5000:5000"
    volumes:
      - /etc/noddle/registry:/certs:ro
      - registry-data:/var/lib/registry
    networks:
      - noddle-public

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NODDLE_COMMIT: ${NODDLE_COMMIT:-}
    restart: unless-stopped
    environment:
      APP_KEY: ${APP_KEY:?APP_KEY missing}
      DATABASE_URL: postgres://noddle:${POSTGRES_PASSWORD}@postgres:5432/noddle
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_URL: ${NODDLE_URL:-}
    volumes:
      - noddle-logs:/var/lib/noddle/logs:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    labels:
      - traefik.enable=true
      - traefik.http.routers.noddle-web.entrypoints=web
      - traefik.http.routers.noddle-web.rule=PathPrefix(`/`)
      - traefik.http.routers.noddle-web.priority=1
      - traefik.http.services.noddle-web.loadbalancer.server.port=3000
    networks:
      - noddle-public

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
      args:
        NODDLE_COMMIT: ${NODDLE_COMMIT:-}
    restart: unless-stopped
    environment:
      APP_KEY: ${APP_KEY:?APP_KEY missing}
      DATABASE_URL: postgres://noddle:${POSTGRES_PASSWORD}@postgres:5432/noddle
      REDIS_URL: redis://redis:6379
      LOG_ROOT: /var/lib/noddle/logs
      TRAEFIK_NETWORK: noddle-public
      REGISTRY_HOST: ${REGISTRY_HOST:-}
      REGISTRY_PASSWORD: ${REGISTRY_PASSWORD:-}
    volumes:
      - noddle-logs:/var/lib/noddle/logs
      - /etc/noddle/ssh:/etc/noddle/ssh:ro
      - /etc/noddle/registry/ca.crt:/etc/noddle/registry/ca.crt:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks:
      - noddle-public

volumes:
  postgres-data:
  redis-data:
  noddle-logs:
  registry-data:

networks:
  noddle-public:
    external: true
