name: noddle

services:
  # ── proxy ────────────────────────────────────────────────────────────────
  traefik:
    image: traefik:v3.7.9
    # Pinned, and not at random: under 3.6 the embedded Docker SDK is locked
    # to API 1.24, which Docker Engine 29 refuses. The Swarm provider then
    # NEVER connects, discovers nothing, and everything answers 404 — while
    # the service, its labels, and the overlay network are all perfectly
    # correct. It's the most misleading failure in the whole chain. Since
    # Noddle installs Docker itself, it owns both halves of this pair:
    # letting them drift apart independently breaks fresh installs.
    restart: unless-stopped
    command:
      # Two providers on the same socket. `docker` sees this file's
      # containers, `swarm` sees the services deployed by the worker.
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.swarm=true
      - --providers.swarm.exposedByDefault=false
      - --providers.swarm.network=noddle-public
      - --entrypoints.web.address=:80
      - --log.level=INFO
    ports:
      - "80:80"
    volumes:
      # Read-only: Traefik discovers, it doesn't drive.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - noddle-public

  # ── state ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: noddle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing}
      POSTGRES_DB: noddle
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noddle -d noddle"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - noddle-public

  redis:
    image: redis:7
    restart: unless-stopped
    # The log buffer has a TTL and the BullMQ queue rebuilds itself; what
    # really matters lives in Postgres. Persistence just avoids losing
    # pending jobs on restart.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - noddle-public

  # ── image registry ───────────────────────────────────────────────────────
  #
  # It makes an image portable between nodes. Without it, a built image only
  # exists on ITS node, and every service has to stay pinned to it.
  #
  # It does NOT go through Traefik: its certificate comes from the CA
  # generated by the installer, not ACME. A registry behind Traefik would
  # only get TLS with a domain — but nodes need to be able to pull an image
  # on an installation reached by its IP, and two code paths where only one
  # is exercised always end up diverging. Side benefit: nothing to copy over
  # into docker-compose.tls.yml, the one place in the repo where two copies
  # already have to move together.
  registry:
    image: registry:3.1.1
    # Pinned to the exact patch, like Traefik. The config path changed
    # between v2 and v3 (/etc/docker/registry → /etc/distribution), and the
    # retention pass calls `registry garbage-collect` with that path.
    restart: unless-stopped
    environment:
      REGISTRY_HTTP_ADDR: 0.0.0.0:5000
      REGISTRY_HTTP_TLS_CERTIFICATE: /certs/registry.crt
      REGISTRY_HTTP_TLS_KEY: /certs/registry.key
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: noddle
      REGISTRY_AUTH_HTPASSWD_PATH: /certs/htpasswd
      # Without this, no deletion is possible and the registry grows without
      # end. Deleting a manifest frees NOTHING by itself — measured: the tag
      # disappears, the volume doesn't move by a single byte. It's
      # `registry garbage-collect` that reclaims the bytes, and it first
      # needs deleted manifests to collect.
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    ports:
      - "5000:5000"
    volumes:
      - /etc/noddle/registry:/certs:ro
      - registry-data:/var/lib/registry
    networks:
      - noddle-public

  # ── control plane ────────────────────────────────────────────────────────
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        # Set by `install.sh` from the repo it just updated. Empty on a
        # `docker compose build` run by hand: the update screen then says
        # "unknown version" rather than making one up.
        NODDLE_COMMIT: ${NODDLE_COMMIT:-}
    restart: unless-stopped
    environment:
      APP_KEY: ${APP_KEY:?APP_KEY missing}
      DATABASE_URL: postgres://noddle:${POSTGRES_PASSWORD}@postgres:5432/noddle
      REDIS_URL: redis://redis:6379
      LOG_ROOT: /var/lib/noddle/logs
      # better-auth's own variable, read without a single line of our code.
      # If absent, the origin is derived from the request — which works for
      # IP access, but verifies less.
      BETTER_AUTH_URL: ${NODDLE_URL:-}
    volumes:
      # The worker WRITES the build logs, the web reads them back for
      # finished deployments. Live streaming goes through Redis instead:
      # nothing in the real-time path depends on this volume.
      - noddle-logs:/var/lib/noddle/logs:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    labels:
      - traefik.enable=true
      - traefik.http.routers.noddle-web.entrypoints=web
      # Catch-all, lowest priority: the dashboard answers whatever no
      # deployed application claims. Application Host rules have a higher
      # priority and therefore take precedence, which lets Noddle be reached
      # by bare IP before it has a domain.
      - traefik.http.routers.noddle-web.rule=PathPrefix(`/`)
      - traefik.http.routers.noddle-web.priority=1
      - traefik.http.services.noddle-web.loadbalancer.server.port=3000
    networks:
      - noddle-public

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
      args:
        # Set by `install.sh` from the repo it just updated. Empty on a
        # `docker compose build` run by hand: the update screen then says
        # "unknown version" rather than making one up.
        NODDLE_COMMIT: ${NODDLE_COMMIT:-}
    restart: unless-stopped
    environment:
      APP_KEY: ${APP_KEY:?APP_KEY missing}
      DATABASE_URL: postgres://noddle:${POSTGRES_PASSWORD}@postgres:5432/noddle
      REDIS_URL: redis://redis:6379
      LOG_ROOT: /var/lib/noddle/logs
      TRAEFIK_NETWORK: noddle-public
      # The address ALL nodes use to pull, written into every image tag. If
      # absent, the worker falls back to the pre-registry behavior: local
      # build and a service pinned to its node. This is what makes updating
      # an existing installation safe — new code on a stack that hasn't been
      # restarted yet behaves like the old one.
      REGISTRY_HOST: ${REGISTRY_HOST:-}
      REGISTRY_PASSWORD: ${REGISTRY_PASSWORD:-}
    volumes:
      - noddle-logs:/var/lib/noddle/logs
      # The host key, for initial adoption only. Afterward it lives
      # ENCRYPTED in the database, and it's that copy the worker decrypts.
      - /etc/noddle/ssh:/etc/noddle/ssh:ro
      # The CA ALONE, never the directory: it also contains the CA's private
      # key and the registry's, which the worker has no use for. It needs
      # the public certificate for two things — verifying the registry it
      # queries, and depositing that same CA on each node.
      - /etc/noddle/registry/ca.crt:/etc/noddle/registry/ca.crt:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks:
      - noddle-public

volumes:
  postgres-data:
  redis-data:
  noddle-logs:
  registry-data:

networks:
  # Created by install.sh as an attachable overlay, NOT by compose: it's the
  # same network the deployed Swarm services join, so it must exist
  # beforehand, outside this stack's lifecycle.
  noddle-public:
    external: true
