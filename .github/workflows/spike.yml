name: spike

on:
  schedule:
    - cron: "0 4 * * *"
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/spike.yml"
  pull_request:
    paths:
      - "scripts/**"
      - ".github/workflows/spike.yml"
  workflow_dispatch:

concurrency:
  group: spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chain:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - name: Free up disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      - name: SSH to itself
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server
          sudo systemctl enable --now ssh

          ssh-keygen -t ed25519 -N '' -f ~/.ssh/id_ed25519 -q
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys

          # `awk` accumulates and prints only at the end: no early `exit`, so
          # no SIGPIPE on the producer. The pipefail trap hit in Phase 0 has
          # already cost us one run.
          IP="$(ip -4 route get 1.1.1.1 | awk '{for(i=1;i<=NF;i++) if($i=="src") ip=$(i+1)} END {print ip}')"
          echo "TARGET_IP=$IP" >> "$GITHUB_ENV"
          echo "TARGET_SSH=$USER@$IP" >> "$GITHUB_ENV"

          ssh -o StrictHostKeyChecking=accept-new "$USER@$IP" 'echo "SSH OK: $(uname -sr)"'

      - name: 1. create — the chain end to end
        run: ./scripts/spike-local.sh

      - name: 2. update — the docker service update path
        run: ./scripts/spike-local.sh

      - name: 3. break — a broken image does not cut the service
        run: ./scripts/spike-local.sh break

      - name: 4. cap — a memory-hungry build is killed
        run: ./scripts/spike-local.sh cap

      - name: Versions used
        if: always()
        run: |
          {
            echo "### Versions on this run"
            echo
            echo '| Component | Version |'
            echo '|---|---|'
            echo "| Docker Engine | $(docker version --format '{{.Server.Version}}' 2>/dev/null || echo '?') |"
            echo "| Docker API | $(docker version --format '{{.Server.APIVersion}}' 2>/dev/null || echo '?') (min $(docker version --format '{{.Server.MinAPIVersion}}' 2>/dev/null || echo '?')) |"
            echo "| Traefik | $(grep -oE 'traefik:v[0-9.]+' scripts/spike-local.sh | head -1) |"
            echo "| railpack | $(railpack --version 2>/dev/null || echo 'not installed') |"
            echo "| BuildKit | $(grep -oE 'moby/buildkit:v[0-9.]+' scripts/spike-local.sh | head -1) |"
            echo "| Runner | $(uname -sr) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "::group::services"
          sudo docker service ls || true
          sudo docker service ps spike-app --no-trunc || true
          echo "::endgroup::"
          echo "::group::traefik logs"
          sudo docker service logs noddle-traefik --tail 60 2>&1 || true
          echo "::endgroup::"
          echo "::group::app logs"
          sudo docker service logs spike-app --tail 60 2>&1 || true
          echo "::endgroup::"
          echo "::group::swarm state"
          sudo docker info --format 'swarm={{.Swarm.LocalNodeState}}' || true
          sudo docker network ls || true
          echo "::endgroup::"
