name: verify-install

on:
  push:
    paths:
      - "installer/**"
      - "apps/**"
      - "packages/**"
      - ".github/workflows/verify-install.yml"
  pull_request:
    paths:
      - "installer/**"
      - "apps/**"
      - "packages/**"
      - ".github/workflows/verify-install.yml"
  workflow_dispatch:

concurrency:
  group: verify-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        privilege: [root, sudo]

    steps:
      - uses: actions/checkout@v5

      - name: Free up disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      - name: sshd, for the host adoption step
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server
          sudo systemctl enable --now ssh

      - name: A branch to clone from
        run: |
          git branch -f ci-under-test HEAD
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install as ${{ matrix.privilege }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.privilege }}" = "root" ]; then
            sudo env -u SUDO_USER \
              NODDLE_REPO="$GITHUB_WORKSPACE" NODDLE_REF=ci-under-test \
              bash installer/install.sh
          else
            NODDLE_REPO="$GITHUB_WORKSPACE" NODDLE_REF=ci-under-test \
              bash installer/install.sh
          fi

      - name: The dashboard answers
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1/login || true)"
            [ "$code" = "200" ] && break
            sleep 5
          done
          [ "$code" = "200" ] || { echo "dashboard answered $code, expected 200"; exit 1; }
          echo "dashboard: HTTP 200"

      - name: The control plane is off the workload network
        run: |
          set -euo pipefail
          for host in redis postgres; do
            if sudo docker run --rm --network noddle-public busybox:1.36 \
                 getent hosts "$host" >/dev/null 2>&1; then
              echo "$host resolves from noddle-public — every deployed workload can reach it"
              exit 1
            fi
            echo "$host: unreachable from noddle-public"
          done

      - name: Redis refuses an unauthenticated client
        run: |
          set -euo pipefail
          net="$(sudo docker inspect noddle-redis-1 \
            -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}')"
          out="$(sudo docker run --rm --network "$net" redis:7 \
            redis-cli -h redis PING 2>&1 || true)"
          case "$out" in
            *NOAUTH*) echo "redis: NOAUTH without a password" ;;
            *) echo "redis answered '$out' with no password"; exit 1 ;;
          esac

      - name: A plain-HTTP install does not emit a Secure cookie
        run: |
          set -euo pipefail
          headers="$(curl -s -i --max-time 15 \
            -X POST http://127.0.0.1/api/auth/sign-up/email \
            -H 'Content-Type: application/json' \
            -H 'Origin: http://127.0.0.1' \
            -d '{"email":"ci@example.invalid","password":"ci-probe-password","name":"ci"}')"
          echo "$headers" | grep -i '^set-cookie' || { echo "no session cookie issued"; exit 1; }
          if echo "$headers" | grep -i '^set-cookie' | grep -q 'Secure'; then
            echo "session cookie carries Secure over http:// — the browser will drop it"
            exit 1
          fi
          echo "session cookie: not Secure, as a plain-HTTP install needs"

      - name: Versions on this run
        if: always()
        run: |
          {
            echo "### verify-install (${{ matrix.privilege }})"
            echo
            echo '| Component | Version |'
            echo '|---|---|'
            echo "| Docker Engine | $(docker version --format '{{.Server.Version}}' 2>/dev/null || echo '?') |"
            echo "| Traefik | $(grep -oE 'traefik:v[0-9.]+' installer/docker-compose.yml | head -1) |"
            echo "| railpack | $(railpack --version 2>/dev/null || echo 'not installed') |"
            echo "| Runner | $(uname -sr) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "::group::containers"
          sudo docker ps -a || true
          echo "::endgroup::"
          echo "::group::networks per container"
          for c in $(sudo docker ps --format '{{.Names}}'); do
            printf '%s: ' "$c"
            sudo docker inspect "$c" \
              -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}' || true
          done
          echo "::endgroup::"
          echo "::group::traefik"
          sudo docker logs noddle-traefik-1 --tail 60 2>&1 || true
          sudo docker inspect noddle-traefik-1 -f '{{json .Config.Cmd}}' || true
          echo "::endgroup::"
          echo "::group::web"
          sudo docker logs noddle-dashboard-1 --tail 60 2>&1 || true
          echo "::endgroup::"
          echo "::group::worker"
          sudo docker logs noddle-worker-1 --tail 60 2>&1 || true
          echo "::endgroup::"
