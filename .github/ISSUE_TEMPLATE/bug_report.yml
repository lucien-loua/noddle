name: "Bug report"
description: Something Noddle does is wrong, or stops working
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please search open and closed issues first — infrastructure bugs are often already reported.

        If you are not sure whether this is a bug, open a [discussion](https://github.com/lucien-loua/noddle/discussions/new?category=general) instead.

  - type: textarea
    id: bug-description
    attributes:
      label: What happened
      description: What you expected, and what happened instead. If you intend to open a pull request for this, say so here.
      placeholder: "Deploying a service leaves it stuck at building, and the dashboard never shows a result."
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where
      description: Which part of Noddle. Pick the closest one.
      options:
        - Install or update
        - Dashboard (a screen, a form, something visual)
        - Deploying a service or a Compose stack
        - Databases (provisioning, credentials, connection)
        - Backups or restore
        - Servers, SSH or the terminal
        - Git providers, webhooks or previews
        - Registry or image builds
        - Something else
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      description: The steps you took. For a deploy, the kind of repository matters — say whether it has a Dockerfile, a Compose file, or is built by Railpack.
      placeholder: |
        1. Add a service from a Git repository with no Dockerfile
        2. Deploy it
        3. The log stops after "build.railpack" and nothing else happens
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Noddle version
      description: "Settings shows it under Noddle, next to Running. If it predates version stamping, paste the commit shown there instead."
      placeholder: "v0.1.6"
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: How it was installed
      options:
        - The installer script on a fresh machine
        - The installer script over an existing install (an update)
        - Cloned the repository and ran it myself
        - Something else
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: The machine
      description: |
        Noddle's own host, and the target server if it is a different one. `docker version --format '{{.Server.Version}}'`, the distribution, and how much memory the machine has — a build failing on a small server is a different bug from a build failing at all.
      render: bash
      placeholder: |
        Host: Debian 13, 2 GB, Docker 29.7.1
        Target: same machine (self host)
        Dashboard reached over: plain HTTP on an IP
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        `docker logs noddle-worker-1 --tail 100` and `docker logs noddle-dashboard-1 --tail 100`, from around the time it happened. For a failing deploy, the build log from the deployment page is the useful one. Paste the text rather than a screenshot.

        Noddle redacts credentials inside URLs, but read what you paste before posting it.
      render: bash
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Before submitting
      description: By submitting this issue you agree to follow the [contributing guidelines](https://github.com/lucien-loua/noddle/blob/main/CONTRIBUTING.md).
      options:
        - label: I searched the existing issues
          required: true
        - label: I removed any secret from the logs and configuration I pasted
          required: true
