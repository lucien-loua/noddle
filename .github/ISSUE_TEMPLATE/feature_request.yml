name: "Feature request"
description: Something Noddle should do and does not
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please search open and closed issues first.

        Noddle chooses restraint over feature count — every screen answers "is it healthy" and "how do I ship". A request that makes one of those two questions easier to answer has a much better chance than one that adds a third.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The situation you are in, before any solution. What you reach for today, and why it does not work.
      placeholder: "I run three services that share a database, and I cannot tell from the dashboard which of them is holding connections."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like Noddle to do
      description: Optional. If you already have a shape in mind, describe it — but the problem above matters more.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Where it belongs
      options:
        - Install or update
        - Dashboard (a screen, a form, something visual)
        - Deploying a service or a Compose stack
        - Databases
        - Backups or restore
        - Servers, SSH or the terminal
        - Git providers, webhooks or previews
        - Registry or image builds
        - Something else
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
      description: A workaround, another tool, or a manual step. This says a lot about how much the gap costs.
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Before submitting
      description: By submitting this issue you agree to follow the [contributing guidelines](https://github.com/lucien-loua/noddle/blob/main/CONTRIBUTING.md).
      options:
        - label: I searched the existing issues
          required: true
